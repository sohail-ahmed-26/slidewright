services:
  db:
    image: postgres:16
    container_name: slidewright-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slidewright
      POSTGRES_PASSWORD: slidewright
      POSTGRES_DB: slidewright
    ports:
      - "5432:5432"
    volumes:
      - slidewright_pgdata:/var/lib/postgresql/data
volumes:
  slidewright_pgdata:
